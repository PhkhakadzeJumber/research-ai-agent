[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eureka"
version = "0.1.0"
description = "AI research discovery & validation agent"
requires-python = ">=3.11"
# Direct dependencies only, with compatible ranges.
# Exact versions of everything (incl. sub-dependencies) are pinned in requirements.txt.
dependencies = [
    "alembic>=1.13",            # database migrations
    "anthropic>=2.6,<3",        # Claude API (used only via src/llm.py)
    "asyncpg>=0.29",            # async PostgreSQL driver
    "pgvector>=0.3",            # vector column type for SQLAlchemy (embeddings)
    "pydantic>=2.7,<3",         # agent output shapes (src/ai/schemas), validated on every LLM response
    "sqlalchemy[asyncio]>=2.0,<3",  # database toolkit: tables, queries, sessions
    "google-adk>=2.13,<3",      # agent framework; Claude via its AnthropicLlm model class
    "google-genai>=2.34,<3",    # Vertex AI embeddings (src/retrieval/embeddings.py)
    "httpx>=0.28,<1",           # async HTTP client for the literature source adapters
    "python-dotenv>=1.0",       # loads .env in development
    "tzdata>=2024.1",           # time zone database (Asia/Tbilisi) for Windows and slim containers
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the repo-root `scripts` package
# Tests marked "live" call real (paid) APIs: excluded by default, run with: pytest -m live
# -rs prints the reason for every skipped test (e.g. "database not running") in the summary.
addopts = "-m 'not live' -rs"
markers = [
    "live: calls real external APIs (Claude etc.) and costs money; run explicitly with -m live",
    "db: needs the local test database (docker compose up -d db); skipped with a reason if it isn't running",
]
